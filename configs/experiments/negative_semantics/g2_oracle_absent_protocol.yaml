# Frozen SV0/G2 receiver-controllability protocol. Oracle text is an
# evaluation-only receiver side input: it is neither transmitted nor counted.
protocol_id: negative_semantics_g2_oracle_absent_v1_0
protocol_version: 1.0.0
frozen_at: "2026-09-07"
freeze_status: frozen
parent_protocol: negative_semantics_g1_v1_2

scope:
  gate: G2
  purpose: establish_receiver_oracle_absent_controllability_before_rsm
  training: false
  evidence_split: pilot
  heldout_access: prohibited
  smoke_outputs_are_evidence: false
  oracle_claim_scope: mechanism_feasibility_only

dependency:
  g1_run_root: outputs/negative_semantics_g1_pilot_rtx4080_v1_1
  g1_detection_rows: outputs/negative_semantics_g1_pilot_rtx4080_v1_1/evaluator/detection_rows.jsonl
  g1_detection_rows_sha256: 49886142f71f84b3532c2792fabecefc59a0e0f1bede671621091b9a1514607c
  g1_evaluator_freeze: outputs/negative_semantics_g1_pilot_rtx4080_v1_1/evaluator/evaluator_freeze.json
  g1_evaluator_freeze_sha256: 237d86af2e4a34728f6180edd967699db09ee53006f615b1cf6db83f6da448b9
  g1_v1_2_summary: outputs/negative_semantics_g1_pilot_rtx4080_v1_1_derived_v1_2c/g1_summary_v1_2.json
  g1_v1_2_summary_sha256: 8c5f302501da8c54d1e93486edfd40476cf49f8ff4848987e8643c7ff870908f
  allow_exploratory_g2_while_g1_scientific_gate_not_passed: true
  inheritance:
    evaluator_model_and_revision: exact
    detector_threshold: exact
    pilot_video_set: exact

data:
  dataset_root: data/negative_semantics/g1/pilot
  ground_truth_index: data/negative_semantics/g1/pilot/ground_truth_index.json
  ground_truth_index_sha256: 2ba1173e05c263bb00c83256d19776f9dc44bc6d7b1ac3c9438c1a1664350cee
  preparation_manifest: data/negative_semantics/g1/pilot/preparation_manifest.json
  preparation_manifest_sha256: 6e1bd7d48db154792fa4a9f31fce681fda481070be9af2f6a2e1cfc810b1fc84
  expected_videos: 40
  annotation_unit: annotated_timestep

reconstruction:
  config: configs/experiments/negative_semantics/g1_reconstruction.yaml
  base_config: fixed_int4
  guide_profile: candidate_both_omit
  selector: fixed
  fixed_max_gop: 16
  temporal_reuse_threshold: 0.2
  snr_db: 10.0
  digital_step_policy: fixed_reference
  fixed_reference_snr_db: 10.0
  decoder_mode: diffusion
  policies:
    few10: 10
    full50: 50
  seeds: [2025]
  spatial_transform:
    image_long_side: 512
    pad_to_multiple: 128
    evaluation_crop_internal_padding: true

negative_conditioning:
  arms: [no_negative, random_negative, frequency_negative, oracle_negative]
  prompt_mode: append
  baseline_quality_negative_preserved: true
  no_negative_definition: no_object_semantic_negative_suffix
  oracle_definition: official_gt_closed_vocabulary_complement
  oracle_side_input: receiver_only
  oracle_eval_only: true
  serialized_in_packet: false
  rate_accounted: false
  controls_match_oracle_concept_count_per_frame: true
  random_seed: 27091
  # Ranking frozen from G1 few10/seed-2025 source-paired additional detections
  # at OWLv2 threshold 0.2. Counts: dog 50, cat 45, bicycle 28, bird 25,
  # person 5, vehicle 2, motorcycle 1.
  frequency_ranking: [dog, cat, bicycle, bird, person, vehicle, motorcycle]

evaluator:
  model_id: google/owlv2-base-patch16-ensemble
  concepts: [person, bird, cat, dog, bicycle, motorcycle, vehicle]
  queries:
    person: a person
    bird: a bird
    cat: a cat
    dog: a dog
    bicycle: a bicycle
    motorcycle: a motorcycle
    vehicle: a vehicle
  threshold_source: frozen_g1_source_only_calibration
  threshold: 0.2

metrics:
  primary_h_add: source_paired
  raw_h_add_reported_separately: true
  false_suppression:
    definition: gt_present_and_detected_in_no_negative_but_not_candidate
  statistics:
    cluster_unit: video
    bootstrap_iterations: 5000
    confidence_level: 0.95
    one_sided_gate_intervals: true

gate:
  primary_policy: few10
  h_add_relative_reduction_min: 0.25
  require_h_add_delta_upper_one_sided_95_below_zero: true
  false_suppression_increase_ci_upper_max: 0.02
  psnr_drop_db_max: 0.5
  ssim_drop_max: 0.01
  lpips_rise_max: 0.02
  smoke_video_id: ovis_valid_1b664206
