# Frozen G0 contract for the negative-semantics paper track.
protocol_id: negative_semantics_g0_v1_2
protocol_version: 1.2.0
frozen_at: "2026-09-03"
freeze_status: frozen
supersedes_protocol_version: 1.1.0
amendment_record: docs/experiments/2026-09-03_negative_semantics_g0_official_gt_amendment_v1_2.md
amendment_policy: >-
  Any change after this file is committed requires a version bump, a dated
  amendment record, and must occur before the affected split is opened.

research:
  track: full
  title: Joint Positive-Negative Semantic Source Coding with Revocable Receiver Memory
  primary_venue: IEEE Transactions on Multimedia
  fallback_venue: IEEE Transactions on Circuits and Systems for Video Technology
  claim_boundary:
    - prior-map-free with online partial receiver memory
    - no final claim from the legacy ETRI ten-video development set
    - no joint-allocation claim unless the matched-rate Pareto gate passes
    - automated endpoints support official-GT-derived additional-object and ghost-track claims, not human-perceived hallucination claims

data:
  split_manifest: data/negative_semantics/g0/dataset_split_manifest.json
  split_manifest_sha256: data/negative_semantics/g0/dataset_split_manifest.sha256
  event_annotations:
    - data/negative_semantics/g0/etri_legacy_event_annotations.jsonl
    - data/negative_semantics/g0/ovis_official_gt_event_annotations.jsonl
  event_schema: data/negative_semantics/g0/event_schema.schema.json
  ontology_manifest: data/negative_semantics/g0/ontology_manifest.json
  category_mapping: data/negative_semantics/g0/youtube_vos_category_mapping.json
  ovis_category_mapping: data/negative_semantics/g0/ovis_category_mapping.json
  data_use_approval: data/negative_semantics/g0/data_use_approval.json
  heldout_seal: data/negative_semantics/g0/heldout_seal.json
  acquisition:
    youtube_vos_train_archive: data/external/youtube_vos_2019/archives/train.tar
    youtube_vos_valid_archive: data/external/youtube_vos_2019/archives/valid.tar
    davis_trainval_archive: data/external/davis_2017/archives/DAVIS-2017-trainval-480p.zip
    ovis_valid_frames_archive: data/external/ovis/archives/valid.zip
    ovis_valid_gt: data/external/ovis/archives/annotations_valid_withgt.json
  fixed_split_counts:
    pilot: 40
    train: 3471
    development: 10
    validation: 507
    heldout_test: 30
  pilot_independent_event_range: [30, 50]
  final_min_independent_videos: 50
  final_min_verified_events: 100
  generation_seeds: [2025, 2026, 2027]
  split_opening_order: [pilot, train, development, validation, heldout_test]
  heldout_policy: >-
    Held-out test source IDs must be disjoint from every earlier split and from
    etri_internal_legacy_v1. DAVIS 2017 val is sealed at G0 and opened once only
    after method choices, thresholds, budgets, and validation operating point freeze.
  pilot_selection: >-
    Derive candidates from the provider-published OVIS validation with-GT
    annotations using the frozen v1.2 rules, then use deterministic bipartite
    matching to select 10 ENTER, 10 EXIT, 10 OCCLUDE, and 10 REAPPEAR events.
    Every selected event must come from a different native video.

rate_accounting:
  primary_unit: total_wire_bytes_per_source_frame
  includes:
    - positive_payload
    - negative_payload
    - protection
    - feedback
    - retransmission
    - headers
    - padding
  excludes:
    - local_model_weights
    - offline_annotation_files
  budget_caps_bytes_per_source_frame: [2048, 4096, 8192, 16384]
  matched_rate_rule: >-
    Every method is re-optimized independently under the same cap. Padding may
    equalize a comparison but cannot by itself establish a Pareto improvement.

compute_accounting:
  matched_compute_fields:
    - generation_count
    - diffusion_steps
    - detector_calls
    - vlm_calls
    - predictor_calls
  reported_fields:
    - end_to_end_latency_p50_s
    - end_to_end_latency_p95_s
    - gpu_seconds
    - peak_vram_bytes
    - retry_count

state_contract:
  values: [present, confirmed_absent, unknown]
  event_state_scope: entity_id
  confirmed_absent_rule: >-
    In an event row, confirmed_absent applies to the official entity_id, not to
    every instance of its concept. It requires provider GT plus the frozen border
    transition rule for ENTER/EXIT. Missing detector output and ambiguous terminal
    disappearances remain unknown.
  concept_absence_opportunity_rule: >-
    For H_add only, concept c is confirmed absent at an annotated timestep iff no
    provider GT instance mapped to c is present there. Unmapped categories and
    detector misses never establish absence.

event_contract:
  types: [ENTER, EXIT, OCCLUDE, REAPPEAR, SCENE_CUT]
  transition_rules:
    ENTER: confirmed_absent_to_present
    EXIT: present_to_confirmed_absent
    OCCLUDE: present_to_present_and_visible_or_partial_to_occluded
    REAPPEAR: present_to_present_and_occluded_to_visible_or_partial
    SCENE_CUT: scene_epoch_increments_and_entity_transition_is_not_implied
  independent_unit: independence_cluster_id
  clustering_rule: >-
    Events from one video and causal episode share a cluster. Adjacent entity
    transitions at one scene cut are not counted as independent observations.
  boundary_unit: annotated_timestep
  source_frame_stride: 5
  boundary_tolerance_annotated_timesteps: 1
  derivation_rules:
    ENTER: first_present_at_or_after_timestep_2_and_three_visible_steps_and_bbox_touches_2px_border
    EXIT: first_absent_after_last_present_with_three_visible_steps_and_bbox_touches_2px_border
    OCCLUDE: internal_absent_gap_at_least_1_with_three_visible_steps_each_side_non_no_occlusion_flanks_and_no_5px_border_contact
    REAPPEAR: end_of_the_same_internal_gap_used_by_OCCLUDE

metrics:
  primary:
    h_add:
      definition: >-
        Frozen-evaluator detections of concept c in the reconstruction when no
        provider GT instance mapped to c is present, divided by all such
        (video, annotated_timestep, concept) confirmed-absent opportunities.
      aggregation: event first, then video-clustered paired difference
      direction: lower_is_better
      success_margin_absolute: -0.01
    ghost_survival_auc:
      definition: >-
        Mean of the binary post-exit presence curve over frames 0..15, normalized
        by 16; right-censored events are excluded from the primary AUC and reported.
      horizon_frames: 16
      direction: lower_is_better
      success_margin_absolute: -0.05
  safety:
    false_suppression_rise:
      definition: >-
        Candidate-minus-positive-only fraction of official-GT present object
        opportunities classified absent by the frozen independent evaluator.
      noninferiority_margin_absolute: 0.015
    object_recall_drop:
      noninferiority_margin_absolute: 0.02
    reappearance_identity_drop:
      definition: >-
        Positive-only-minus-candidate fraction of REAPPEAR events whose returned
        entity is matched to the same pre-occlusion official instance by the
        frozen independent tracking evaluator.
      noninferiority_margin_absolute: 0.05
  quality:
    psnr_drop_db: 0.5
    ssim_drop: 0.01
    lpips_rise: 0.02
  statistics:
    comparison: paired by video, seed, and budget
    cluster_unit: video
    bootstrap_iterations: 5000
    confidence_level: 0.95
    primary_gate: one_sided_upper_confidence_bound_at_or_below_margin
    secondary_multiplicity: holm_or_explicitly_exploratory

evaluation_independence:
  primary_endpoint_evaluator: official_gt_anchored_automated_evaluator
  panel_size: 0
  selector_output_hidden: true
  method_and_budget_hidden: true
  automated_presence_screen:
    role: primary_after_g1_calibration_freeze
    model_id: google/owlv2-base-patch16-ensemble
    must_not_share_weights_with_selector: true
  official_gt_role: source_event_and_reference_state
  output_scope: automatic_additional_object_and_ghost_track_detection
  prohibited_wording: human_verified_or_human_perceived_hallucination
  g1_requirement: freeze_evaluator_thresholds_and_selector_weight_separation_before_validation

gates:
  preregistration: configs/experiments/negative_semantics/g0_preregistered_gate.json
  audit_command: python scripts/audit_negative_semantics_g0.py --repo-root .
  require_pass_command: python scripts/audit_negative_semantics_g0.py --repo-root . --require-pass
  pass_requires:
    - 30_to_50_official_gt_verified_independent_pilot_events
    - nonempty_source_disjoint_heldout_test
    - sealed_heldout_test
    - approved_license_for_every_assigned_source
    - recorded_project_data_use_approval
    - reproducible_acquisition_and_hashes
