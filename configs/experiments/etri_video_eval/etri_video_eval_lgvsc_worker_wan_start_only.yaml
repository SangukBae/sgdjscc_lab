# configs/experiments/etri_video_eval/etri_video_eval_lgvsc_worker_wan_start_only.yaml –
# ExternalSegmentWorkerGenerator REAL segment-level model example config
# (ETRI 후속 1단계 step 1B, Wan, start-only conditioning).
#
# This is the SAFE / VERIFIED default Wan config: conditioning_mode: start_only
# (image + prompt only, no last_image). A real GPU smoke test with this exact
# mode (14B model, 64x64, 63s) succeeded — see docs/lgvsc_1b_worker_readiness.md
# "WAN_SMOKE_TEST_STARTONLY_OK". For the end-keyframe / last_image bidirectional
# mode, use configs/experiments/etri_video_eval/etri_video_eval_lgvsc_worker_wan_bidirectional_experimental.yaml
# instead — real GPU bidirectional currently FAILS on this machine's
# diffusers/checkpoint combo (image_encoder class mismatch), so it is kept
# separate rather than being the default here.
#
# Points the generate branch at scripts/lgvsc_generate_worker.py's `wan`
# backend (diffusers WanImageToVideoPipeline) running in a SEPARATE conda
# environment that has `torch`+`diffusers`+`transformers`+`accelerate`
# installed — never `ptest`. Read docs/lgvsc_1b_worker_readiness.md FIRST —
# it covers the conda env split, model size/VRAM/disk requirements, and what
# was and wasn't actually run against real GPU in this repo.
#
# Why Wan instead of SVD (configs/experiments/etri_video_eval/etri_video_eval_lgvsc_worker_svd.yaml)
# -------------------------------------------------------------------------
# SVD's pipeline only accepts ONE conditioning image — no text prompt, no
# second image. Wan's image-to-video pipeline genuinely supports the fuller
# LGVSC segment contract this project needs:
#   - `image`      = start keyframe (always used, and all this config uses)
#   - `last_image` = end keyframe, when this GOP has one → REAL bidirectional
#                    conditioning (not a linear blend like the mock backends)
#                    — see the bidirectional_experimental config, NOT this one
#   - `prompt`     = the target frame's caption → REAL text conditioning
#                    (used here — start-only conditioning still passes prompt)
# `side_infos` (semantic-delta/motion dicts) are still accepted by the
# manifest but NOT used for conditioning by either backend — an explicit,
# documented limitation (see lgvsc_generate_worker.py::run_wan_backend).
#
# `python_bin` below points at THIS MACHINE's existing `semantic-diffusers`
# conda env (diffusers 0.39.0.dev0, torch 2.12 cu130). Getting
# WanImageToVideoPipeline importable there during 1B follow-up required two
# environment fixes (see docs/lgvsc_1b_worker_readiness.md for the exact
# errors): `pip install -U transformers` (old transformers needed
# huggingface-hub<1.0, which conflicted with what was installed) followed by
# `pip install -U peft` (the newly-upgraded transformers removed
# `HybridCache`, which the older peft imported unconditionally), and
# `pip uninstall torchaudio` (an ABI-incompatible torchaudio build broke
# transformers' unconditional `import torchaudio` in its audio-utils module —
# unneeded for video generation, so removing it is the simplest fix).
#
# The smallest official Wan I2V checkpoint (Wan2.1-I2V-14B-480P-Diffusers) is
# ~90GB and 14B parameters — treat height/width/num_inference_steps/
# offload_mode below as a starting point for a SHORT smoke test on a 16GB
# card, not a quality-tuned production config.
#
# Usage (real SGD-JSCC/diffusion reconstruction + real Wan generate worker,
# short smoke test):
#   python scripts/evaluate_video.py \
#       --config configs/experiments/etri_video_eval/etri_video_eval_lgvsc_worker_wan_start_only.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --snr 5 --device cuda:0 --max-frames 4
#
# First run downloads ~90GB of weights (no login/license gate — the
# Wan-AI/* repos on Hugging Face are public, Apache-2.0).

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  # Smoke-test config: with --no-models and repeated captions, the default
  # reuse threshold would reuse inter-frames and never call the worker. Force
  # generate decisions so a short --max-frames run actually exercises Wan.
  reuse_threshold: 0.0

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, start-only ────────
# start_only (not bidirectional): this is the mode actually verified against
# real GPU output (see docs/lgvsc_1b_worker_readiness.md). Wan's last_image
# argument is never sent in this config.
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_start_only/generated_frames"

  worker:
    python_bin: "${oc.env:SGDJSCC_LGVSC_WORKER_PYTHON,python}"
    backend: wan
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    # Low-VRAM smoke-test defaults for a 16GB card. Increase these only after
    # a first real worker run produces frames successfully.
    height: 320
    width: 320
    num_inference_steps: 10
    timeout_sec: 3600               # Wan I2V-14B can be very slow per segment,
                                    # especially with CPU offload — 60 min ceiling
    cleanup_on_success: false       # keep generated frames on disk for inspection
    extra_json: '{"offload_mode": "sequential"}'   # "sequential" | "model" | omit
    extra_env:
      # See docs/lgvsc_1b_worker_readiness.md "1B Wan 검토" for why each of
      # these was needed on this machine's semantic-diffusers env.
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
