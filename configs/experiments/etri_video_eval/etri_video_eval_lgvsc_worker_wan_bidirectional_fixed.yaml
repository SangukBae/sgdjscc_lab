# configs/etri_video_eval_lgvsc_worker_wan_bidirectional_fixed.yaml –
# ExternalSegmentWorkerGenerator REAL segment-level model example config
# (ETRI 후속 1단계 step 1B, Wan, BIDIRECTIONAL conditioning — FIXED).
#
# This is the config that makes bidirectional (`last_image`) conditioning
# actually work on real GPU. configs/etri_video_eval_lgvsc_worker_wan_
# bidirectional_experimental.yaml is kept around as the failure-reproduction
# config (do NOT delete it — its header documents the original diagnosis);
# use THIS config for a real bidirectional run.
#
# Root cause of the original failure (see docs/lgvsc_1b_worker_readiness.md
# for the full investigation) — NOT a diffusers version bug:
# `WanImageToVideoPipeline`'s `last_image` path needs the loaded checkpoint's
# `transformer/config.json` to have `pos_embed_seq_len` set. That value backs
# a learned positional-embedding parameter
# (`WanImageEmbedding.pos_embed`, in `transformer_wan.py`) that reshapes the
# two-image (start+end) CLIP embedding batch (`[2, seq, dim]`) into a single
# doubled-length sequence (`[1, 2*seq, dim]`) so it can be concatenated with
# the batch-1 text embedding. `Wan-AI/Wan2.1-I2V-14B-480P-Diffusers` (used by
# wan_start_only.yaml) has NO `pos_embed_seq_len` — it was only ever trained
# for single-image conditioning — so that reshape never happens and the
# concat crashes downstream with a batch-size-mismatch RuntimeError. Wan's
# official **first-last-frame** checkpoint,
# `Wan-AI/Wan2.1-FLF2V-14B-720P-Diffusers`, DOES ship `pos_embed_seq_len: 514`
# and is architecturally built for exactly this (start+end keyframe)
# conditioning. Confirmed by directly inspecting both checkpoints'
# transformer/config.json and the diffusers source
# (`WanImageEmbedding.forward()`), not by trial and error.
#
# Because a single video can have segments both with and without an end
# keyframe (only the last GOP in a video lacks one), `run_wan_backend()` in
# scripts/lgvsc_generate_worker.py now picks the checkpoint PER SEGMENT:
#   - segment HAS an end keyframe  -> extra_json.bidirectional_model_id
#     (Wan2.1-FLF2V-14B-720P below) — real two-image conditioning.
#   - segment has NO end keyframe  -> worker.model_id (Wan2.1-I2V-14B-480P,
#     same as wan_start_only.yaml) — the checkpoint that actually supports
#     start-only conditioning.
# If a checkpoint is ever loaded that doesn't match what the segment needs
# (e.g. FLF2V-720P used for a start-only segment, or I2V-480P used for a
# bidirectional one), run_wan_backend raises WorkerBackendUnavailableError
# immediately with an explanation — it does NOT let the pipeline crash with
# the cryptic downstream tensor-shape error, and it does NOT silently fall
# back to a fake/interpolated blend.
#
# `python_bin` points at THIS MACHINE's existing `semantic-diffusers` conda
# env — see wan_start_only.yaml / docs/lgvsc_1b_worker_readiness.md for the
# environment-fix history (transformers/peft/torchaudio upgrades,
# PYTHONNOUSERSITE) and Wan-vs-SVD rationale; unchanged here.
#
# Both checkpoints are ~90GB each (14B parameters, Apache-2.0, no HF login
# needed) — running a segment of each mode in the same evaluate_video.py
# invocation downloads/caches both (~180GB total) on first use.
#
# Usage — MUST use enough --max-frames that at least one non-final GOP
# exists (i.e. an end keyframe is actually available for some segment);
# with the default `keyframe.max_gop: 12` (configs/video/default.yaml),
# --max-frames 14 gives GOP 1 (frames 0-11, HAS an end keyframe -> real
# bidirectional) and GOP 2 (frames 12-13, the video's last GOP, no end
# keyframe -> start-only via the 480P checkpoint):
#   python scripts/evaluate_video.py \
#       --config configs/etri_video_eval_lgvsc_worker_wan_bidirectional_fixed.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --snr 5 --device cuda:0 --max-frames 14

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  # Smoke-test config: with --no-models and repeated captions, the default
  # reuse threshold would reuse inter-frames and never call the worker. Force
  # generate decisions so a short --max-frames run actually exercises Wan.
  reuse_threshold: 0.0

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, bidirectional ─────
# conditioning_mode is inert for backend: external_segment_worker (the worker
# is conditioning-mode-agnostic — see build_generator()'s docstring); it is
# set here only for documentation/consistency with the sibling configs. What
# actually decides bidirectional vs start-only per segment is whether that
# GOP has a real end_keyframe, and run_wan_backend picks the checkpoint
# accordingly (see header above).
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: bidirectional
  bidirectional_missing_end_policy: fallback_start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_worker_wan_bidirectional_fixed/generated_frames"

  worker:
    python_bin: "/home/sangukbae/anaconda3/envs/semantic-diffusers/bin/python"
    backend: wan
    # Used for segments WITHOUT an end keyframe (verified real GPU success —
    # see wan_start_only.yaml).
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    # Minimal smoke-test settings — same as the values that succeeded in the
    # first real-GPU start-only run (see docs/lgvsc_1b_worker_readiness.md
    # "WAN_SMOKE_TEST_STARTONLY_OK"). Increase only after this config
    # produces frames successfully.
    height: 64
    width: 64
    num_inference_steps: 4
    timeout_sec: 3600               # per-segment ceiling; FLF2V-720P load +
                                    # inference can be slow with CPU offload
    cleanup_on_success: false       # keep generated frames on disk for inspection
    extra_json: '{"offload_mode": "sequential", "bidirectional_model_id": "Wan-AI/Wan2.1-FLF2V-14B-720P-Diffusers"}'
    extra_env:
      # See docs/lgvsc_1b_worker_readiness.md "1B Wan 검토" for why each of
      # these was needed on this machine's semantic-diffusers env.
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
