# configs/experiments/etri_video_eval/etri_video_eval.yaml – ETRI 10-video 평가용 수동(단일 실행) 템플릿.
#
# scripts/run_etri_video_eval.py 배치 드라이버는 이 템플릿과 동일한 구성을
# 각 run 디렉터리에 config.yaml로 자동 생성한다(출력 경로는 run 디렉터리
# 기준으로 재배치). 이 파일은 배치 없이 한 영상을 직접 돌려볼 때 쓴다.
#
# 사용 예 (스모크):
#   python scripts/evaluate_video.py --config configs/experiments/etri_video_eval/etri_video_eval.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --no-models --save-video
#
# 실모델 실행은 --no-models를 빼고 --snr 5 --device cuda:0 등을 지정한다.
#
# 단계별 기능(verifier/generate/accounting/...)은 아래 주석 블록의 플래그를
# 켜서 조합한다 — 기본값은 전부 OFF로 composed_video.yaml과 동일하게 동작한다.

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false
use_packet_eval: true

# ── 출력 (수동 실행분은 outputs/etri_video_eval/manual/ 아래로 격리) ──────────
keyframe_json: "${sgdjscc:run}/etri_video_eval/manual/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual/recon.mp4"

# ── 선택 기능 (배치 드라이버의 stage와 동일한 토글) ──────────────────────────
# motion gate sweep (1차 step 3):
# temporal:
#   motion_threshold: 0.05

# Packet Verifier (2차 step 7):
# use_packet_verifier: true
# verifier:
#   enabled: true
#   report_json: "${sgdjscc:run}/etri_video_eval/manual/packet_match_report.json"
#   report_csv: "${sgdjscc:run}/etri_video_eval/manual/packet_match_report.csv"
#   decisions_json: "${sgdjscc:run}/etri_video_eval/manual/controller_decisions.json"
#   decisions_csv: "${sgdjscc:run}/etri_video_eval/manual/controller_decisions.csv"

# OWLv2/VQA presence calibration (5차 step 8, 실제 weight 검증용):
# 이 파일에 직접 verifier.presence_backend_cfg를 채우는 대신, 바로 실행
# 가능한 예시 3개를 별도 config로 준비해뒀다 — 각 config의 usage 주석과
# docs/etri_owlv2_vqa_readiness.md 참조:
#   configs/experiments/etri_video_eval/etri_video_eval_owlv2.yaml     (presence_mode: owlv2_only)
#   configs/experiments/etri_video_eval/etri_video_eval_vqa.yaml       (presence_mode: vqa_only)
#   configs/experiments/etri_video_eval/etri_video_eval_ensemble.yaml  (presence_mode: ensemble_weighted)

