# configs/etri_lgvsc_1c_wan_skem_dsa.yaml – 1C LGVSC-reproduction baseline
# (mode: wan_skem_dsa).
#
# Part of the ETRI 후속 1단계 step 1C reproduction-baseline set (see
# docs/lgvsc_1c_reproduction_readiness.md). The `video_generator`/`worker`
# block below is copied verbatim from the already real-GPU-verified
# `configs/etri_video_eval_lgvsc_worker_wan_bidirectional_fixed.yaml` (1B Wan
# bidirectional smoke: segment 0 conditioning_mode=bidirectional,
# end_keyframe_index=12, n_generated=11 via Wan2.1-FLF2V-14B-720P; segment 1,
# the video's last GOP with no end keyframe, conditioning_mode=start_only via
# Wan2.1-I2V-14B-480P — both real, both succeeded) — only output-path fields
# differ. `scripts/batch_lgvsc_1c_reproduce.py`'s test suite asserts this
# file's `video_generator.worker` block matches that source file's, so they
# cannot silently drift apart.
#
# LGVSC correspondence ("nearest reproducible", NOT faithful reproduction):
# start+end keyframe + caption conditioning corresponds to LGVSC's **DSA
# (Dual-side/end Adapter)** side of `SKEM+DSA` — two reference keyframes
# (segment start and end) + semantic text jointly condition the segment
# generator. The **SKEM** half (semantic/PSSS-based keyframe selection,
# choosing keyframes by meaning-change rather than a fixed frame interval) is
# **NOT separately implemented** in this repository — every 1C mode,
# including this one, uses the SAME keyframe extraction
# (`keyframe.max_gop` + scene-change detector in `configs/video/default.yaml`)
# as wan_skim_sfa. Do not read "wan_skem_dsa" as "this run used LGVSC's SKEM
# keyframe selector" — it did not; only the DSA-style dual-keyframe decoder
# conditioning is genuinely reproduced here. `side_infos` (motion/delta
# dicts, closer to what a real PSSS/side-info adapter would consume) are
# accepted by the manifest but NOT folded into conditioning (documented
# limitation, see lgvsc_generate_worker.py::run_wan_backend) — this is the
# "no PSSS/side-info adapter" gap the user's brief calls out. See
# docs/lgvsc_1c_reproduction_readiness.md before citing this as more than an
# approximation.
#
# Usage (manual, single video, smoke — needs >= one segment with an end
# keyframe to actually exercise the bidirectional path; with the default
# keyframe.max_gop: 12, --max-frames must be > 12, e.g. 14):
#   python scripts/evaluate_video.py --config configs/etri_lgvsc_1c_wan_skem_dsa.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --no-models --max-frames 14 --save-video
#
# Quality-run adjustment points (see docs/lgvsc_1c_reproduction_readiness.md):
#   - temporal.reuse_threshold: 0.0 below is a smoke-test setting; raise it
#     consistently across all four etri_lgvsc_1c_*.yaml configs for a fair
#     comparison table.
#   - worker.height/width/num_inference_steps are low-VRAM smoke defaults
#     (64x64, 4 steps, matching the real-GPU-verified values) — raise for
#     quality once a first run succeeds.
#   - Both checkpoints (Wan2.1-I2V-14B-480P + Wan2.1-FLF2V-14B-720P) may need
#     to download on first use (~180GB combined) — see
#     docs/lgvsc_1b_worker_readiness.md.

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  reuse_threshold: 0.0

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, bidirectional ─────
# Copied from configs/etri_video_eval_lgvsc_worker_wan_bidirectional_fixed.yaml
# — keep worker.* in sync with that file (a test asserts this). Segment-level
# checkpoint selection (I2V-480P for segments without an end keyframe,
# FLF2V-720P for segments with one) happens automatically inside
# scripts/lgvsc_generate_worker.py::run_wan_backend — no config toggle needed.
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: bidirectional
  bidirectional_missing_end_policy: fallback_start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skem_dsa/generated_frames"

  worker:
    python_bin: "/home/sangukbae/anaconda3/envs/semantic-diffusers/bin/python"
    backend: wan
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    height: 64
    width: 64
    num_inference_steps: 4
    timeout_sec: 3600
    cleanup_on_success: false
    extra_json: '{"offload_mode": "sequential", "bidirectional_model_id": "Wan-AI/Wan2.1-FLF2V-14B-720P-Diffusers"}'
    extra_env:
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
