# configs/etri_lgvsc_1c_wan_skim_sfa.yaml – 1C LGVSC-reproduction baseline
# (mode: wan_skim_sfa).
#
# Part of the ETRI 후속 1단계 step 1C reproduction-baseline set (see
# docs/lgvsc_1c_reproduction_readiness.md). The `video_generator`/`worker`
# block below is copied verbatim from the already real-GPU-verified
# `configs/etri_video_eval_lgvsc_worker_wan_start_only.yaml` (1B Wan
# start-only smoke: 14B model, 64x64, 63s, real success) — only output-path
# fields differ. `scripts/batch_lgvsc_1c_reproduce.py`'s test suite asserts
# this file's `video_generator.worker` block matches that source file's, so
# they cannot silently drift apart.
#
# LGVSC correspondence ("nearest reproducible", NOT faithful reproduction):
# start-keyframe + caption conditioning corresponds to LGVSC's **SFA
# (Start-frame Adapter)** side of `SKIM+SFA` — a single reference keyframe +
# semantic text conditions the segment generator, no end-keyframe signal.
# The **SKIM** half (fixed-interval keyframe extraction) IS what this
# repository's `keyframe.max_gop` + scene-change detector already does
# (`configs/video/default.yaml`), and it is shared by ALL FOUR 1C modes —
# this config does not implement a separate "SKIM-specific" keyframe
# selection distinct from wan_skem_dsa's. The distinction these two Wan
# configs actually provide is on the DECODER/conditioning side (single-image
# SFA-style vs two-image DSA-style), not the keyframe-selection side. See
# docs/lgvsc_1c_reproduction_readiness.md's "approximation" section before
# citing this as a faithful SKIM+SFA reproduction. `side_infos` (motion/delta
# dicts) are accepted by the manifest but NOT folded into conditioning
# (documented limitation, see lgvsc_generate_worker.py::run_wan_backend) —
# this is the "no PSSS/side-info adapter" gap the user's brief calls out.
#
# Usage (manual, single video, smoke):
#   python scripts/evaluate_video.py --config configs/etri_lgvsc_1c_wan_skim_sfa.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --no-models --max-frames 14 --save-video
#
# Quality-run adjustment points (see docs/lgvsc_1c_reproduction_readiness.md):
#   - temporal.reuse_threshold: 0.0 below is a smoke-test setting; raise it
#     consistently across all four etri_lgvsc_1c_*.yaml configs for a fair
#     comparison table.
#   - worker.height/width/num_inference_steps are low-VRAM smoke defaults
#     (64x64, 4 steps) — raise for quality once a first run succeeds (the
#     shipped 320x320/10-step values in etri_video_eval_lgvsc_worker_wan_
#     start_only.yaml were NOT the ones actually smoke-tested on real GPU;
#     64x64/4-steps is — see docs/lgvsc_1b_worker_readiness.md).

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  reuse_threshold: 0.0

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, start-only ────────
# Copied from configs/etri_video_eval_lgvsc_worker_wan_start_only.yaml — keep
# worker.* in sync with that file (a test asserts this).
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_wan_skim_sfa/generated_frames"

  worker:
    python_bin: "/home/sangukbae/anaconda3/envs/semantic-diffusers/bin/python"
    backend: wan
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    height: 320
    width: 320
    num_inference_steps: 10
    timeout_sec: 3600
    cleanup_on_success: false
    extra_json: '{"offload_mode": "sequential"}'
    extra_env:
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
