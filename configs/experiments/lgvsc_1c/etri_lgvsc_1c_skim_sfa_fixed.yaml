# configs/etri_lgvsc_1c_skim_sfa_fixed.yaml – 1C LGVSC-reproduction baseline
# (mode: skim_sfa_fixed) — the SKIM+SFA side of the SKIM/SFA vs SKEM/DSA
# comparison (PSSS/SKEM readiness step).
#
# This is `wan_skim_sfa` (`configs/etri_lgvsc_1c_wan_skim_sfa.yaml`) with the
# keyframe-selection side REPLACED by `keyframe.selector: fixed_interval`
# (`video/keyframe_extractor.py::FixedIntervalKeyframeSelector`) — a LITERAL
# fixed-interval selector with ZERO scene-change signal, exactly the paper's
# SKIM definition (equal-length segments, keyframe = first frame of each).
# This is a real behavioural change from `wan_skim_sfa`/the bare
# `keyframe.selector: fixed` default (`KeyframeExtractor`, which also reacts
# to scene-change distance — see docs/lgvsc_1c_reproduction_readiness.md's
# "nearest reproducible, not fixed-interval" caveat, which is why this
# separate config exists). `keyframe.fixed_interval.interval: 12` matches
# `skem_dsa_psss.yaml`'s `keyframe.psss.max_segment_length: 12` — this only
# shares the same WORST-CASE segment length, NOT the actual keyframe count/
# CBR SKEM produces on a given video (SKEM inserts keyframes earlier whenever
# PSSS decides the content diverged, so it usually transmits MORE keyframes
# than this static interval). For a keyframe-count-matched comparison, run
# skem_dsa_psss first, then re-run this mode via
# `scripts/batch_lgvsc_1c_reproduce.py --keyframe-count-match-from
# skem_dsa_psss`. The generated per-video config switches to
# `keyframe.selector: fixed_count` and guarantees exactly SKEM's observed
# keyframe count even when no integer fixed interval can represent it. This
# is still count matching, not proof of equal serialized/channel-symbol CBR.
# Inspect keyframe_match_status, cbr_accounting_kind, and cbr_match_status in
# the summary; proxy accounting never upgrades the result to CBR "verified".
#
# LGVSC correspondence ("nearest reproducible" on the decoder side only, NOT
# faithful reproduction overall): start-keyframe + caption conditioning
# corresponds to LGVSC's SFA (Start-frame Adapter) side of SKIM+SFA — this
# part is still an approximation (real SFA/decoder internals aren't public).
# The keyframe-selection side (SKIM) is now genuinely literal, not an
# approximation: `FixedIntervalKeyframeSelector` never looks at frame content
# at all.
#
# Usage (manual, single video, smoke):
#   python scripts/evaluate_video.py --config configs/etri_lgvsc_1c_skim_sfa_fixed.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --no-models --max-frames 14 --save-video
#
# See configs/etri_lgvsc_1c_wan_skim_sfa.yaml for the quality-run adjustment
# points (temporal.reuse_threshold, worker.height/width/num_inference_steps)
# — identical here.

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  reuse_threshold: 0.0

keyframe:
  selector: fixed_interval              # literal SKIM — no scene-change signal, see header
  fixed_interval:
    interval: 12                       # matches skem_dsa_psss.yaml's max_segment_length

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, start-only ────────
# Copied from configs/etri_video_eval_lgvsc_worker_wan_start_only.yaml — keep
# worker.* in sync with that file (a test asserts this, same as wan_skim_sfa).
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skim_sfa_fixed/generated_frames"

  worker:
    python_bin: "/home/sangukbae/anaconda3/envs/semantic-diffusers/bin/python"
    backend: wan
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    height: 320
    width: 320
    num_inference_steps: 10
    timeout_sec: 3600
    cleanup_on_success: false
    extra_json: '{"offload_mode": "sequential"}'
    extra_env:
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
