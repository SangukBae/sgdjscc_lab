# configs/experiments/lgvsc_1c/etri_lgvsc_1c_skem_dsa_mock_psss.yaml – 1C diagnostic mode
# (mode: skem_dsa_mock_psss) — structural smoke-test twin of
# skem_dsa_psss.yaml, with NO real model dependency at all.
#
# **MOCK PSSS, NOT a real PSSS score.** `keyframe.psss.backend: mock`
# (`MockPsssBackend` in src/sgdjscc_lab/video/psss.py) computes S_rel from
# lexical token overlap between two frame-statistics placeholder captions
# (`keyframe.psss.caption_source: mock` — deterministic per-channel mean
# intensity strings, NOT real captioning). This exists to verify, on CPU with
# --no-models and zero downloads, that the PSSS/SKEM selector wiring —
# autoregressive keyframe insertion, variable-length GOP construction,
# min/max segment length enforcement, and segments.json's
# `keyframe_selection` provenance fields — is structurally correct. It proves
# NOTHING about real PSSS/SKEM quality or the paper's reported SKEM+DSA gains
# — see docs/lgvsc_psss_skem_readiness.md.
#
# The decoder side also stays mock (`video_generator.backend: auto` →
# BidirectionalInterpolationGenerator, a linear blend — same as
# mock_baseline.yaml), so this config's ONLY distinguishing dimension vs
# mock_baseline is the keyframe SELECTOR (psss vs fixed) — useful for an
# apples-to-apples "does the selector alone change segment
# count/length/keyframe positions" comparison without any decoder-conditioning
# confound.
#
# Usage (manual, single video, smoke — safe, no GPU, no downloads):
#   python scripts/evaluate_video.py --config configs/experiments/lgvsc_1c/etri_lgvsc_1c_skem_dsa_mock_psss.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --no-models --max-frames 14 --save-video

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  reuse_threshold: 0.0

keyframe:
  selector: psss
  psss:
    backend: mock
    threshold: 0.35
    semantic_focus: "the main subject and action"
    min_segment_length: 2
    max_segment_length: 12
    caption_source: mock                # frame-statistics placeholder — NOT real captions

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/recon.mp4"

# ── Generate branch: mock backend, bidirectional (interpolation, not a
#    learned model) — identical to mock_baseline.yaml's generate-branch block.
use_video_gen: true
video_generator:
  enabled: true
  backend: auto                        # -> bidirectional_interpolation (mock)
  conditioning_mode: bidirectional
  bidirectional_missing_end_policy: fallback_start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_mock_psss/generated_frames"
