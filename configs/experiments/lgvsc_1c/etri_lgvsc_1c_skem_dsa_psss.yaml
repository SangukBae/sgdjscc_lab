# configs/experiments/lgvsc_1c/etri_lgvsc_1c_skem_dsa_psss.yaml – 1C LGVSC-reproduction baseline
# (mode: skem_dsa_psss) — the SKEM+DSA side of the SKIM/SFA vs SKEM/DSA
# comparison (PSSS/SKEM readiness step). REAL MLLM PSSS + REAL Wan
# bidirectional GPU generation — the most complete comparison line this
# repository can run, and the most expensive (real MLLM weights + real Wan
# 14B weights, two separate model loads).
#
# This is `wan_skem_dsa` (`configs/experiments/lgvsc_1c/etri_lgvsc_1c_wan_skem_dsa.yaml`) with the
# keyframe-selection side REPLACED: `keyframe.selector: psss` (SKEM,
# src/sgdjscc_lab/video/skem_selector.py) instead of the fixed scene-change/
# max_gop extractor every OTHER 1C mode uses. Concretely this means:
#   - keyframes are inserted autoregressively when PSSS's S_rel score
#     (P("No") - P("Yes") from an actual MLLM's next-token probabilities —
#     see src/sgdjscc_lab/video/psss.py) exceeds `keyframe.psss.threshold`
#     (0.35, the paper's SKEM+DSA experimental value) — NOT a fixed interval.
#   - segments are genuinely VARIABLE-length as a result (bounded by
#     min_segment_length/max_segment_length below, not forced to any single
#     length) — this is what LGVSC's DSA (dynamic semantic-adapter) is
#     needed for; the decoder side (Wan bidirectional worker below) already
#     supports arbitrary segment length per-call (ETRI 1A's segment contract
#     was never length-fixed to begin with — see
#     docs/lgvsc_psss_skem_readiness.md).
#   - the last GOP (no following keyframe) still falls back to the
#     start-only Wan checkpoint automatically (`bidirectional_missing_end_
#     policy: fallback_start_only` below, same as wan_skem_dsa) — recorded in
#     segments.json's `generation.conditioning_mode`.
#
# keyframe.psss.backend: real REQUIRES an actual HF causal-LM/VLM
# (`keyframe.psss.real.model_id` below) whose tokenizer/model can be loaded
# via transformers.AutoModelForCausalLM/AutoTokenizer and that exposes
# next-token logits. The placeholder model_id below (a small instruction-
# tuned model) is a REASONABLE STARTING POINT, not a validated choice — the
# paper uses InternVL2-8B for SKEM's captioning+PSSS; swap this to whatever
# MLLM you have GPU budget for.
#
# keyframe.psss.caption_source: captions_file (not "model") — real-GPU batch
# testing on a single 16GB card showed the combined footprint of JSCC + BLIP2
# (for model-based PSSS captioning) + Qwen2.5-1.5B-Instruct (PSSS scorer) +
# diffusion backbone + ControlNet + CLIP already consumes ~13.7GB by itself,
# before the external Wan worker subprocess even starts — OOMs during the
# very next allocation (MuGE edge extraction). "model" would additionally
# require use_text: true (BLIP2 loaded) which is exactly the VRAM the other
# three modes had to free via use_text: false to fit the Wan worker at all.
# captions_file reuses the same --captions text already supplied for packet
# building instead of a live BLIP2 call per PSSS candidate frame — PSSS's own
# S_rel scoring (the actual "SKEM" mechanism under test) still runs for real
# against a real MLLM; only the caption INPUT to that scoring is pre-supplied
# rather than freshly generated. See docs/lgvsc_1c_reproduction_readiness.md.
use_text: false
#
# LGVSC correspondence and remaining gaps — see
# docs/lgvsc_psss_skem_readiness.md for the full accounting. Headline: this
# is the closest this repository gets to LGVSC's SKEM+DSA, but it is still
# NOT a faithful reproduction — no learned DSA adapter (Wan's own
# architecture is reused unmodified for both segment lengths), no side-info
# encoding, PSSS's captioning model may differ from InternVL2-8B, and no
# quantitative comparison against the paper's own numbers has been run.
#
# Usage (manual, single video — needs a real HF model + real Wan weights;
# NOT a --no-models-safe smoke test, unlike skem_dsa_mock_psss.yaml):
#   python scripts/evaluate_video.py --config configs/experiments/lgvsc_1c/etri_lgvsc_1c_skem_dsa_psss.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --device cuda:0 --max-frames 14 --save-video

_defaults_:
  - ../../base/channel/awgn
  - ../../base/model/sgdjscc
  - ../../base/infer/awgn
  - ../../base/eval/default
  - ../../base/video/default

use_phase4: true
use_phase5: false

temporal:
  reuse_threshold: 0.0

keyframe:
  selector: psss
  psss:
    backend: real
    threshold: 0.35                    # eta_th, paper's SKEM+DSA value
    semantic_focus: "the main subject and action"
    min_segment_length: 2              # ETRI addition — see configs/base/video/default.yaml
    max_segment_length: 12             # ETRI addition — matches the other modes' max_gop
    caption_source: captions_file       # reuses --captions text; see use_text note above
                                        # (was "model" — OOM'd real-GPU, see header)
    real:
      model_id: "Qwen/Qwen2.5-1.5B-Instruct"   # placeholder — swap for your available MLLM
      device: cuda:0
      dtype: bf16

keyframe_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/keyframes.json"
segment_json: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/segments.json"
temporal_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/temporal_metrics.csv"
frame_log_csv: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/temporal_frames.csv"
video_io:
  extracted_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/_extracted"
  recon_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/recon.mp4"

# ── Generate branch: external worker, real (wan) backend, bidirectional ─────
# Copied from configs/experiments/etri_video_eval/etri_video_eval_lgvsc_worker_wan_bidirectional_fixed.yaml
# — keep worker.* in sync with that file (a test asserts this, same as
# wan_skem_dsa). Segment-level checkpoint selection (I2V-480P for segments
# without an end keyframe, FLF2V-720P for segments with one) happens
# automatically inside scripts/lgvsc_generate_worker.py::run_wan_backend.
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: bidirectional
  bidirectional_missing_end_policy: fallback_start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "${sgdjscc:run}/etri_video_eval/manual_lgvsc_1c_skem_dsa_psss/generated_frames"

  worker:
    python_bin: "${oc.env:SGDJSCC_LGVSC_WORKER_PYTHON,python}"
    backend: wan
    model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
    device: "cuda:0"
    dtype: bf16
    seed: 1234
    height: 64
    width: 64
    num_inference_steps: 4
    timeout_sec: 3600
    cleanup_on_success: false
    extra_json: '{"offload_mode": "sequential", "bidirectional_model_id": "Wan-AI/Wan2.1-FLF2V-14B-720P-Diffusers"}'
    extra_env:
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
