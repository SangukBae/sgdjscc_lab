# configs/etri_video_eval_lgvsc_worker_svd.yaml – ExternalSegmentWorkerGenerator
# REAL-model example config (ETRI 후속 1단계 step 1B).
#
# Points the generate branch at scripts/lgvsc_generate_worker.py's `svd`
# backend (diffusers StableVideoDiffusionPipeline) running in a SEPARATE
# conda environment that has `torch`+`diffusers`+`transformers`+`accelerate`
# installed — never `ptest`. NOT run as part of any automated preparation
# work — this is the config the user runs themselves for real GPU
# validation. Read docs/lgvsc_1b_worker_readiness.md FIRST — it covers the
# conda env split, Hugging Face auth/license/VRAM/disk requirements, expected
# output paths, and log locations in full.
#
# `python_bin` below points at THIS MACHINE's existing `semantic-diffusers`
# conda env (diffusers 0.39.0.dev0, torch 2.12 cu130, accelerate 1.6.0) —
# found during 1B preparation, not created for it. Getting
# `StableVideoDiffusionPipeline`/`WanImageToVideoPipeline` importable there
# required THREE environment fixes during the 1B Wan follow-up (all applied
# in this env; see docs/lgvsc_1b_worker_readiness.md "1B Wan 검토" for the
# exact errors each one fixed):
#   1. `pip install -U transformers`  (old transformers needed
#      huggingface-hub<1.0, which conflicted with the huggingface-hub already
#      installed here)
#   2. `pip install -U peft`  (the newly-upgraded transformers removed
#      `HybridCache`, which the older peft imported unconditionally)
#   3. `pip uninstall torchaudio`  (an ABI-incompatible torchaudio build broke
#      transformers' unconditional `import torchaudio` inside its audio-utils
#      module — unneeded for image/video generation, so removing it is the
#      simplest fix)
# After those three fixes, this env's own huggingface_hub install is still
# missing `is_offline_mode` at its top level unless user-site packages are
# also on `sys.path` (a second, user-site huggingface_hub happens to have
# it) — hence `extra_env.PYTHONNOUSERSITE: "0"` below. This is the OPPOSITE
# of an earlier version of this config, which set `PYTHONNOUSERSITE: "1"`
# assuming user-site packages were purely a pollution risk; empirically, on
# this machine, excluding them breaks the import instead.
#
# The standard StableVideoDiffusionPipeline conditions on ONE image only — it
# has no text-prompt or second-image input, so this backend does NOT use
# captions/side-info/end-keyframe (see lgvsc_generate_worker.py's run_svd_backend
# docstring). For a backend that uses the FULLER contract (captions,
# real bidirectional conditioning) see
# configs/etri_video_eval_lgvsc_worker_wan_start_only.yaml (`diffusers.
# WanImageToVideoPipeline` supports `image` + `last_image` + `prompt`; the
# bidirectional variant is configs/etri_video_eval_lgvsc_worker_wan_
# bidirectional_experimental.yaml — currently known to fail on real GPU) — or
# write your own adapter and use `--backend callable` /
# `video_generator.worker.backend: callable` for an actual Open-Sora
# integration (see scripts/lgvsc_example_callable_backend.py).
#
# Usage (real SGD-JSCC/diffusion reconstruction + real SVD generate worker):
#   python scripts/evaluate_video.py --config configs/etri_video_eval_lgvsc_worker_svd.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --snr 5 --device cuda:0 --save-video
#
# First run will download the gated model weights — requires
# `huggingface-cli login` and accepting the model's license on huggingface.co
# beforehand (see docs/lgvsc_1b_worker_readiness.md).

_defaults_:
  - channel/awgn
  - model/sgdjscc
  - infer/awgn
  - eval/default
  - video/default

use_phase4: true
use_phase5: false

temporal:
  # SVD smoke-test config: with --no-models and repeated captions, the default
  # reuse threshold would reuse inter-frames and never call the worker. Force
  # generate decisions so a short --max-frames run actually exercises SVD.
  reuse_threshold: 0.0

keyframe_json: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/keyframes.json"
segment_json: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/segments.json"
temporal_csv: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/temporal_metrics.csv"
frame_log_csv: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/temporal_frames.csv"
video_io:
  extracted_frames_dir: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/_extracted"
  recon_frames_dir: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/recon.mp4"

# ── Generate branch: external worker, real (svd) backend, start-only ────────
# start_only, not bidirectional: the standard SVD pipeline can only condition
# on one image — see the module note above.
use_video_gen: true
video_generator:
  enabled: true
  backend: external_segment_worker
  conditioning_mode: start_only
  generate_delta_min: 0.0
  generate_delta_max: 1.0
  save_generated_frames: true
  generated_frames_dir: "../outputs/etri_video_eval/manual_lgvsc_worker_svd/generated_frames"

  worker:
    python_bin: "/home/sangukbae/anaconda3/envs/semantic-diffusers/bin/python"
    backend: svd
    model_id: "stabilityai/stable-video-diffusion-img2vid-xt"
    device: "cuda:0"
    dtype: fp16
    seed: 1234
    # Low-VRAM smoke-test defaults for RTX 4080 16GB. Increase these only
    # after the first real worker run produces frames successfully.
    height: 256
    width: 256
    num_inference_steps: 5
    decode_chunk_size: 1
    timeout_sec: 1800               # SVD can be slow per segment — 30 min ceiling
    cleanup_on_success: false       # keep generated frames on disk for inspection
    extra_env:
      # "0" (i.e. do NOT suppress user-site packages) — see the module note
      # above. Empirically verified during the 1B Wan follow-up: this env's
      # own huggingface_hub install is missing `is_offline_mode` unless
      # user-site packages are also visible.
      PYTHONNOUSERSITE: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
