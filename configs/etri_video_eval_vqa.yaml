# configs/etri_video_eval_vqa.yaml – VQA-only presence-calibration sanity config.
#
# Single-video config for verifying the VQA presence backend against REAL
# weights (BLIP-2 by default, lazy-loaded on first use — needs `transformers`
# and network/cache access the first time). Not run by this preparation task;
# meant for the operator to execute the actual verification themselves. See
# docs/etri_owlv2_vqa_readiness.md for the full readiness writeup.
#
# Usage (held-out remeasurement against an already-completed real-model run's
# saved frames — no reconstruction re-run, see items_from_recon_frame_dirs()):
#   python scripts/remeasure_video_metrics.py --config configs/etri_video_eval_vqa.yaml \
#       --from-recon-frames outputs/etri_video_eval_real_full_step50/baseline/01_person_walk \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --device cuda:0
#
# Real verification run (actual VQA weights, GPU, real reconstruction):
#   python scripts/evaluate_video.py --config configs/etri_video_eval_vqa.yaml \
#       --input data/etri_video_eval/processed/01_person_walk.mp4 \
#       --captions data/etri_video_eval/captions/01_person_walk.txt \
#       --snr 5 --device cuda:0 --save-video

_defaults_:
  - channel/awgn
  - model/sgdjscc
  - infer/awgn
  - eval/default
  - video/default

use_phase4: true
use_phase5: false
use_packet_eval: true

keyframe_json: "../outputs/etri_video_eval/manual_vqa/keyframes.json"
segment_json: "../outputs/etri_video_eval/manual_vqa/segments.json"
temporal_csv: "../outputs/etri_video_eval/manual_vqa/temporal_metrics.csv"
frame_log_csv: "../outputs/etri_video_eval/manual_vqa/temporal_frames.csv"
video_io:
  extracted_frames_dir: "../outputs/etri_video_eval/manual_vqa/_extracted"
  recon_frames_dir: "../outputs/etri_video_eval/manual_vqa/recon_frames"
  save_recon_frames: true
  save_recon_video: true
  recon_video: "../outputs/etri_video_eval/manual_vqa/recon.mp4"

# ── Packet Verifier + VQA-only presence calibration ───────────────────────────
use_packet_verifier: true
verifier:
  enabled: true
  report_json: "../outputs/etri_video_eval/manual_vqa/packet_match_report.json"
  report_csv: "../outputs/etri_video_eval/manual_vqa/packet_match_report.csv"
  decisions_json: "../outputs/etri_video_eval/manual_vqa/controller_decisions.json"
  decisions_csv: "../outputs/etri_video_eval/manual_vqa/controller_decisions.csv"

  use_presence_calibration: true
  presence_mode: vqa_only
  presence_backends: ["vqa"]
  presence_backend_cfg:
    vqa:
      vqa_backend:
        type: blip2                                # mock | blip2 | llava | mplug | none
        model_id: Salesforce/blip2-opt-2.7b-coco    # same checkpoint the caption extractor uses
        device: cuda:0                              # override to cpu if no GPU available

# ── Held-out remeasurement output (5차 step 9) ────────────────────────────────
heldout:
  enabled: true
  clip_only_json: "../outputs/etri_video_eval/manual_vqa/heldout/clip_only_metrics.json"
  clip_only_csv: "../outputs/etri_video_eval/manual_vqa/heldout/clip_only_metrics.csv"
  calibrated_json: "../outputs/etri_video_eval/manual_vqa/heldout/calibrated_metrics.json"
  calibrated_csv: "../outputs/etri_video_eval/manual_vqa/heldout/calibrated_metrics.csv"
  output_json: "../outputs/etri_video_eval/manual_vqa/heldout/metric_delta.json"
  output_csv: "../outputs/etri_video_eval/manual_vqa/heldout/metric_delta.csv"
